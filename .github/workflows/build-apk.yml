
name: BODYGRYZZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extraire le projet
        shell: bash
        run: |
          unzip -q BODYGRYZZ_ANDROID_SOURCE_ALPHA_V2.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Projet Android introuvable"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurer Gradle et corriger Health Connect
        shell: bash
        run: |
          cat > "$PROJECT_DIR/settings.gradle.kts" <<'EOF'
          pluginManagement {
              resolutionStrategy {
                  eachPlugin {
                      if (requested.id.id == "com.google.devtools.ksp") {
                          useModule("com.google.devtools.ksp:symbol-processing-gradle-plugin:${requested.version}")
                      }
                  }
              }
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BODYGRYZZ"
          include(":app")
          EOF

          sed -i 's/version "8\.7\.3"/version "8.10.1"/; s/version "8\.9\.1"/version "8.10.1"/' "$PROJECT_DIR/build.gradle.kts"

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          gradle_file = project / "app" / "build.gradle.kts"
          s = gradle_file.read_text()

          s, count = re.subn(r'compileSdk\s*=\s*35\b', 'compileSdk = 36', s)
          if count == 0:
              s, count = re.subn(r'compileSdk\s*\(\s*35\s*\)', 'compileSdk(36)', s)
          if count == 0 and not re.search(r'compileSdk\s*=\s*36\b', s):
              raise SystemExit("compileSdk introuvable")

          if "androidx.health.connect:connect-client" not in s:
              s += '\n\ndependencies {\n    implementation("androidx.health.connect:connect-client:1.1.0")\n}\n'

          s += '''

          // Compatibilite Java et Kotlin : JVM 17
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          '''
          gradle_file.write_text(s)

          matches = list(project.glob("app/src/main/java/**/MainActivity.kt"))
          if not matches:
              raise SystemExit("MainActivity.kt introuvable")

          for main_file in matches:
              code = main_file.read_text()
              import_line = "import androidx.health.connect.client.PermissionController"

              if import_line not in code:
                  package_match = re.search(r'^package\s+[^\n]+', code, re.MULTILINE)
                  if not package_match:
                      raise SystemExit("Declaration package introuvable dans MainActivity.kt")
                  pos = package_match.end()
                  code = code[:pos] + "\n\n" + import_line + code[pos:]

              main_file.write_text(code)
              print("Import Health Connect ajoute :", main_file)
          PY

      - name: Compiler BODYGRYZZ
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: BODYGRYZZ-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
