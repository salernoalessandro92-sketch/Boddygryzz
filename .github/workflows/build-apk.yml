
name: BODYGRYZZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extraire le projet
        shell: bash
        run: |
          unzip -q BODYGRYZZ_ANDROID_SOURCE_ALPHA_V2.zip -d source

          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Projet Android introuvable"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurer Gradle
        shell: bash
        run: |
          cat > "$PROJECT_DIR/settings.gradle.kts" <<'EOF'
          pluginManagement {
              resolutionStrategy {
                  eachPlugin {
                      if (requested.id.id == "com.google.devtools.ksp") {
                          useModule("com.google.devtools.ksp:symbol-processing-gradle-plugin:${requested.version}")
                      }
                  }
              }
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BODYGRYZZ"
          include(":app")
          EOF

          sed -i 's/version "8\.7\.3"/version "8.10.1"/; s/version "8\.9\.1"/version "8.10.1"/' "$PROJECT_DIR/build.gradle.kts"

      - name: Corriger les dependances et le code Kotlin
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          gradle_file = project / "app" / "build.gradle.kts"
          code = gradle_file.read_text()

          # Android SDK 36
          code, count = re.subn(
              r'compileSdk\s*=\s*35\b',
              'compileSdk = 36',
              code
          )

          if count == 0:
              code, count = re.subn(
                  r'compileSdk\s*\(\s*35\s*\)',
                  'compileSdk(36)',
                  code
              )

          if count == 0 and not re.search(r'compileSdk\s*=\s*36\b', code):
              raise SystemExit("ERREUR : compileSdk introuvable")

          # Java 17 et Kotlin 17
          code += """

          // BODYGRYZZ - Compatibilite JVM 17
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          // Forcer Health Connect 1.1.0
          configurations.configureEach {
              resolutionStrategy.force(
                  "androidx.health.connect:connect-client:1.1.0"
              )
          }

          dependencies {
              implementation("androidx.health.connect:connect-client:1.1.0")
          }
          """

          gradle_file.write_text(code)

          # Corriger l'import dans MainActivity.kt
          matches = list(
              project.glob("app/src/main/java/**/MainActivity.kt")
          )

          if not matches:
              raise SystemExit("ERREUR : MainActivity.kt introuvable")

          for main_file in matches:
              source = main_file.read_text()

              import_line = (
                  "import androidx.health.connect.client.PermissionController"
              )

              if import_line not in source:
                  package_match = re.search(
                      r'^package\s+[^\n]+',
                      source,
                      re.MULTILINE
                  )

                  if not package_match:
                      raise SystemExit("ERREUR : package Kotlin introuvable")

                  position = package_match.end()
                  source = (
                      source[:position]
                      + "\n\n"
                      + import_line
                      + source[position:]
                  )

              main_file.write_text(source)
              print("Import verifie :", main_file)

          print("Configuration BODYGRYZZ terminee.")
          PY

      - name: Verifier Health Connect
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" :app:dependencyInsight --dependency connect-client --configuration debugCompileClasspath

      - name: Compiler BODYGRYZZ
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" clean assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: BODYGRYZZ-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
