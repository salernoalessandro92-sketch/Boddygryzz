
name: BODYGRYZZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraire BODYGRYZZ
        run: |
          unzip -q BODYGRYZZ_ANDROID_SOURCE_ALPHA_V2.zip -d source
          echo "PROJECT_DIR=source/BODYGRYZZ_ANDROID" >> "$GITHUB_ENV"

      - name: Compiler APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: BODYGRYZZ-APK
          path: source/BODYGRYZZ_ANDROID/app/build/outputs/apk/debug/app-debug.apk
