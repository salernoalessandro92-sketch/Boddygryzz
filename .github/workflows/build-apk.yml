
name: BODYGRYZZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle sans cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extraire le projet
        shell: bash
        run: |
          unzip -q BODYGRYZZ_ANDROID_SOURCE_ALPHA_V2.zip -d source

          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Projet Android introuvable"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurer Gradle
        shell: bash
        run: |
          cat > "$PROJECT_DIR/settings.gradle.kts" <<'EOF'
          pluginManagement {
              resolutionStrategy {
                  eachPlugin {
                      if (requested.id.id == "com.google.devtools.ksp") {
                          useModule("com.google.devtools.ksp:symbol-processing-gradle-plugin:${requested.version}")
                      }
                  }
              }
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BODYGRYZZ"
          include(":app")
          EOF

          sed -i 's/version "8\.7\.3"/version "8.10.1"/; s/version "8\.9\.1"/version "8.10.1"/' "$PROJECT_DIR/build.gradle.kts"

      - name: Corriger les dependances Android
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          gradle_file = project / "app" / "build.gradle.kts"
          code = gradle_file.read_text()

          code, count = re.subn(
              r'compileSdk\s*=\s*35\b',
              'compileSdk = 36',
              code
          )

          if count == 0:
              code, count = re.subn(
                  r'compileSdk\s*\(\s*35\s*\)',
                  'compileSdk(36)',
                  code
              )

          if count == 0 and not re.search(r'compileSdk\s*=\s*36\b', code):
              raise SystemExit("ERREUR : compileSdk introuvable")

          # Remplacer les anciennes declarations Health Connect
          code = re.sub(
              r'implementation\s*\(\s*["\']androidx\.health\.connect:connect-client:[^"\']+["\']\s*\)',
              '',
              code
          )

          code += """

          // BODYGRYZZ Health Connect
          dependencies {
              implementation("androidx.health.connect:connect-client:1.1.0")
          }

          configurations.configureEach {
              resolutionStrategy.force(
                  "androidx.health.connect:connect-client:1.1.0"
              )
          }

          // Java et Kotlin JVM 17
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          """

          gradle_file.write_text(code)
          print("Configuration Android corrigee.")

          files = list(project.glob("app/src/main/java/**/MainActivity.kt"))

          if not files:
              raise SystemExit("ERREUR : MainActivity.kt introuvable")

          for file in files:
              source = file.read_text()
              imp = "import androidx.health.connect.client.PermissionController"

              if imp not in source:
                  match = re.search(r'^package\s+[^\n]+', source, re.MULTILINE)
                  if not match:
                      raise SystemExit("Package Kotlin introuvable")
                  pos = match.end()
                  source = source[:pos] + "\n\n" + imp + source[pos:]

              file.write_text(source)
              print("Import verifie :", file)
          PY

      - name: Verifier Health Connect
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" :app:dependencyInsight --dependency connect-client --configuration debugCompileClasspath

      - name: Compiler BODYGRYZZ
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" clean assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: BODYGRYZZ-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
