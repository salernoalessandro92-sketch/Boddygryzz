
name: BODYGRYZZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraire le projet
        shell: bash
        run: |
          unzip -q BODYGRYZZ_ANDROID_SOURCE_ALPHA_V2.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Projet Android introuvable"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurer KSP
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "settings.gradle.kts"
          s = p.read_text()
          s = s.replace(
              "pluginManagement {",
              """pluginManagement {
              resolutionStrategy {
                  eachPlugin {
                      if (requested.id.id == "com.google.devtools.ksp") {
                          useModule("com.google.devtools.ksp:symbol-processing-gradle-plugin:${requested.version}")
                      }
                  }
              }"""
          )
          p.write_text(s)
          PY

      - name: Mettre a jour Android Gradle Plugin
        run: |
          sed -i 's/version "8.7.3"/version "8.9.1"/' "$PROJECT_DIR/build.gradle.kts"

      - name: Compiler BODYGRYZZ
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: BODYGRYZZ-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
