
name: BODYGRYZZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [principal]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire le projet Android
        run: |
          unzip -o BODYGRYZZ_ANDROID_SOURCE_ALPHA_V2.zip
          
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compiler BODYGRYZZ
        working-directory: BODYGRYZZ_ANDROID
        run: gradle --no-daemon assembleDebug

      - name: Recuperer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: BODYGRYZZ-debug-APK
          path: BODYGRYZZ_ANDROID/app/build/outputs/apk/debug/app-debug.apk
